[tool.poetry]
name = "route-calculator-service"
version = "1.0.0"
description = "Serviço de cálculo de rotas otimizadas usando algoritmo A* sobre dados do OpenStreetMap"
authors = ["World of Toilets Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
Flask = "^3.1.2"
flask-cors = "^6.0.1"
osmnx = "^2.0.7"
networkx = "^3.6.1"
shapely = "^2.1.2"
geopandas = "^1.1.1"
gunicorn = "^23.0.0"
python-dotenv = "^1.2.1"
requests = "^2.32.5"
scikit-learn = "^1.8.0"
grpcio = "^1.76.0"
grpcio-tools = "^1.76.0"
protobuf = "^6.33.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
black = "^25.12.0"
flake8 = "^7.3.0"
mypy = "^1.19.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=src --cov-report=html --cov-report=term"
