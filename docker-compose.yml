services:
    nginx:
        image: nginx:alpine
        container_name: wot-nginx
        restart: on-failure
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - type: bind
              source: ./nginx/nginx.conf
              target: /etc/nginx/nginx.conf
              read_only: true
            - type: bind
              source: ./nginx/ssl
              target: /etc/nginx/ssl
              read_only: true
        depends_on:
            api-1:
                condition: service_healthy
            api-2:
                condition: service_healthy
            web-1:
                condition: service_healthy
            web-2:
                condition: service_healthy
            ai:
                condition: service_healthy
            minio:
                condition: service_healthy
            mailhog:
                condition: service_started
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 5s
        networks:
            - wot-network

    minio:
        image: minio/minio:latest
        container_name: wot-minio
        restart: on-failure
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        ports:
            - "9000:9000" 
            - "9001:9001"
        volumes:
            - type: volume
              source: minio_data
              target: /data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s
        networks:
            - wot-network

    minio-init:
        image: minio/mc:latest
        container_name: wot-minio-init
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
            MINIO_BUCKET: ${MINIO_BUCKET}
        volumes:
            - type: bind
              source: ./minio/init-data/init-minio.sh
              target: /init-minio.sh
              read_only: true
            - type: bind
              source: ./minio/init-data/sample-images
              target: /sample-images
              read_only: true
        entrypoint: ["/bin/sh", "/init-minio.sh"]
        networks:
            - wot-network

    mailhog:
        image: mailhog/mailhog:latest
        container_name: wot-mailhog
        restart: on-failure
        ports:
            - "8025:8025"
            - "1025:1025"
        networks:
            - wot-network

    api-1:
        build:
            context: ./apps/api
            dockerfile: Dockerfile
        container_name: wot-api-1
        restart: on-failure
        environment:
            SERVICE_NAME: "api-1"
            DATABASE_PORT: 3306
            DATABASE_HOST: "haproxy"
            DATABASE_NAME: ${MARIADB_DATABASE}
            DATABASE_USER: ${MARIADB_USER}
            DATABASE_PASSWORD: ${MARIADB_PASSWORD}
            JWT_SECRET: ${JWT_SECRET}
            JWT_EXPIRATION: ${JWT_EXPIRATION}
            JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
            EMAIL_VERIFICATION_TOKEN_EXPIRATION: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION}
            PASSWORD_RESET_TOKEN_EXPIRATION: ${PASSWORD_RESET_TOKEN_EXPIRATION}
            COMMENT_SOFT_DELETE_RETENTION: ${COMMENT_SOFT_DELETE_RETENTION}
            REPLY_SOFT_DELETE_RETENTION: ${REPLY_SOFT_DELETE_RETENTION}
            CSRF_SECRET: ${CSRF_SECRET}
            MAIL_HOST: "mailhog"
            MAIL_PORT: 1025
            MAIL_FROM: ${MAIL_FROM}
            FRONTEND_URL: ${FRONTEND_URL}
            MINIO_ENDPOINT: ${MINIO_ENDPOINT}
            MINIO_PORT: 9000
            MINIO_USE_SSL: ${MINIO_USE_SSL}
            MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
            MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
            MINIO_BUCKET: ${MINIO_BUCKET}
            MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
            AI_GRPC_URL: "ai:50051"
            AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT}
            NODE_ENV: "production"
            PORT: 3101
            CORS_ORIGINS: ${CORS_ORIGINS}
        depends_on:
            haproxy:
                condition: service_healthy
            minio:
                condition: service_healthy
            mailhog:
                condition: service_started
            ai:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3101/health"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s
        networks:
            - wot-network

    api-2:
        build:
            context: ./apps/api
            dockerfile: Dockerfile
        container_name: wot-api-2
        restart: on-failure
        environment:
            SERVICE_NAME: "api-2"
            DATABASE_PORT: 3306
            DATABASE_HOST: "haproxy"
            DATABASE_NAME: ${MARIADB_DATABASE}
            DATABASE_USER: ${MARIADB_USER}
            DATABASE_PASSWORD: ${MARIADB_PASSWORD}
            JWT_SECRET: ${JWT_SECRET}
            JWT_EXPIRATION: ${JWT_EXPIRATION}
            JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
            EMAIL_VERIFICATION_TOKEN_EXPIRATION: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION}
            PASSWORD_RESET_TOKEN_EXPIRATION: ${PASSWORD_RESET_TOKEN_EXPIRATION}
            COMMENT_SOFT_DELETE_RETENTION: ${COMMENT_SOFT_DELETE_RETENTION}
            REPLY_SOFT_DELETE_RETENTION: ${REPLY_SOFT_DELETE_RETENTION}
            CSRF_SECRET: ${CSRF_SECRET}
            MAIL_HOST: "mailhog"
            MAIL_PORT: 1025
            MAIL_FROM: ${MAIL_FROM}
            FRONTEND_URL: ${FRONTEND_URL}
            MINIO_ENDPOINT: ${MINIO_ENDPOINT}
            MINIO_PORT: 9000
            MINIO_USE_SSL: ${MINIO_USE_SSL}
            MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
            MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
            MINIO_BUCKET: ${MINIO_BUCKET}
            MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
            AI_GRPC_URL: "ai:50051"
            AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT}
            NODE_ENV: "production"
            PORT: 3102
            CORS_ORIGINS: ${CORS_ORIGINS}
        depends_on:
            haproxy:
                condition: service_healthy
            minio:
                condition: service_healthy
            mailhog:
                condition: service_started
            ai:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3102/health"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s
        networks:
            - wot-network
    
    ai:
        build:
            context: ./apps/ai
            dockerfile: Dockerfile
        container_name: wot-ai
        restart: on-failure
        deploy:
            resources:
                limits:
                    memory: 16G
                    cpus: 2.0
                reservations:
                    memory: 8G
        environment:
            HOST: 0.0.0.0
            PORT: 5000
            GRPC_PORT: 50051
            DEBUG: "False"
            WORKERS: ${AI_WORKERS}
            SERVICE_AREA: ${AI_SERVICE_AREA}
            NETWORK_TYPE: ${AI_NETWORK_TYPE}
            WALKING_SPEED_MPS: ${AI_WALKING_SPEED_MPS}
            GRAPH_CACHE_DIR: /app/cache
            SIMPLIFY_GRAPH: ${AI_SIMPLIFY_GRAPH}
            LOG_LEVEL: ${AI_LOG_LEVEL}
            REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT}
            GRAPH_LOAD_TIMEOUT: ${AI_GRAPH_LOAD_TIMEOUT}
        ports:
            - "5000:5000"
            - "50051:50051"
        volumes:
            - type: volume
              source: ai_cache
              target: /app/cache
            - type: volume
              source: ai_data
              target: /app/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
            interval: 30s
            timeout: 60s
            retries: 20
            start_period: 120s
        networks:
            - wot-network
    
    web-1:
        build:
            context: ./apps/web
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        container_name: wot-web-1
        restart: on-failure
        environment:
            PORT: 3001
            NODE_ENV: "production"
        ports:
            - "3001:3001"
        depends_on:
            api-1:
                condition: service_healthy
            api-2:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s
        networks:
            - wot-network

    web-2:
        build:
            context: ./apps/web
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        container_name: wot-web-2
        restart: on-failure
        environment:
            PORT: 3002
            NODE_ENV: "production"
        ports:
            - "3002:3002"
        depends_on:
            api-1:
                condition: service_healthy
            api-2:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s
        networks:
            - wot-network

    haproxy:
        image: haproxy:latest
        container_name: wot-haproxy
        restart: on-failure
        ports:
            - "3306:3306"
        volumes:
            - type: bind
              source: ./db/haproxy/haproxy.cfg
              target: /usr/local/etc/haproxy/haproxy.cfg
              read_only: true
        depends_on:
            db-1:
                condition: service_healthy
            db-2:
                condition: service_healthy
            db-3:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "bash", "-c", "echo '' > /dev/tcp/127.0.0.1/32087 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 15s
        networks:
            - wot-network

    db-1:
        image: bitnamilegacy/mariadb-galera:latest
        container_name: wot-db-1
        hostname: db-1
        restart: on-failure
        environment:
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
            MARIADB_GALERA_CLUSTER_BOOTSTRAP: "yes"
            MARIADB_GALERA_FORCE_SAFETOBOOTSTRAP: "yes"
            MARIADB_GALERA_MARIABACKUP_PASSWORD: ${MARIADB_GALERA_MARIABACKUP_PASSWORD}
            MARIADB_GALERA_CLUSTER_NAME: ${MARIADB_GALERA_CLUSTER_NAME}
            MARIADB_GALERA_CLUSTER_ADDRESS: ${MARIADB_GALERA_CLUSTER_ADDRESS}
            MARIADB_USER: ${MARIADB_USER}
            MARIADB_PASSWORD: ${MARIADB_PASSWORD}
            MARIADB_DATABASE: ${MARIADB_DATABASE}
        volumes:
            - type: volume
              source: mariadb_db_1_data
              target: /bitnami/mariadb
            - type: bind
              source: ./db/scripts/01-create.sql
              target: /docker-entrypoint-initdb.d/01-create.sql
              read_only: true
            - type: bind
              source: ./db/scripts/02-insert.sql
              target: /docker-entrypoint-initdb.d/02-insert.sql
              read_only: true
        healthcheck:
            test: ['CMD', '/opt/bitnami/scripts/mariadb-galera/healthcheck.sh']
            interval: 15s
            timeout: 5s
            retries: 6
            start_period: 15s
        networks:
            - wot-network

    db-2:
        image: bitnamilegacy/mariadb-galera:latest
        container_name: wot-db-2
        hostname: db-2
        restart: on-failure
        environment:
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
            MARIADB_GALERA_MARIABACKUP_PASSWORD: ${MARIADB_GALERA_MARIABACKUP_PASSWORD}
            MARIADB_GALERA_CLUSTER_NAME: ${MARIADB_GALERA_CLUSTER_NAME}
            MARIADB_GALERA_CLUSTER_ADDRESS: ${MARIADB_GALERA_CLUSTER_ADDRESS}
            MARIADB_USER: ${MARIADB_USER}
            MARIADB_PASSWORD: ${MARIADB_PASSWORD}
            MARIADB_DATABASE: ${MARIADB_DATABASE}
        volumes:
            - type: volume
              source: mariadb_db_2_data
              target: /bitnami/mariadb
        depends_on:
            db-1:
                condition: service_healthy
        healthcheck:
            test: ['CMD', '/opt/bitnami/scripts/mariadb-galera/healthcheck.sh']
            interval: 15s
            timeout: 5s
            retries: 6
            start_period: 15s
        networks:
            - wot-network

    db-3:
        image: bitnamilegacy/mariadb-galera:latest
        container_name: wot-db-3
        hostname: db-3
        restart: on-failure
        environment:
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
            MARIADB_GALERA_MARIABACKUP_PASSWORD: ${MARIADB_GALERA_MARIABACKUP_PASSWORD}
            MARIADB_GALERA_CLUSTER_NAME: ${MARIADB_GALERA_CLUSTER_NAME}
            MARIADB_GALERA_CLUSTER_ADDRESS: ${MARIADB_GALERA_CLUSTER_ADDRESS}
            MARIADB_USER: ${MARIADB_USER}
            MARIADB_PASSWORD: ${MARIADB_PASSWORD}
            MARIADB_DATABASE: ${MARIADB_DATABASE}
        volumes:
            - type: volume
              source: mariadb_db_3_data
              target: /bitnami/mariadb
        depends_on:
            db-2:
                condition: service_healthy
        healthcheck:
            test: ['CMD', '/opt/bitnami/scripts/mariadb-galera/healthcheck.sh']
            interval: 15s
            timeout: 5s
            retries: 6
            start_period: 15s
        networks:
            - wot-network

volumes:
    minio_data:
        driver: local
    ai_cache:
        driver: local
    ai_data:
        driver: local
    mariadb_db_1_data:
        driver: local
    mariadb_db_2_data:
        driver: local
    mariadb_db_3_data:
        driver: local

networks:
    wot-network:
        name: wot-network
        driver: bridge
